<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>REELHOUSE</title>
  <script>
    // GitHub Pages Single Page Application redirect script
    // Stores the target route and redirects back to index.html preserving route parameters
    var pathSegmentsToKeep = 1; // 1 segment for repository name: /reelhouse-movie-explorer/
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
