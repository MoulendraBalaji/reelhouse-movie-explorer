<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="REELHOUSE Movie Explorer — Every film, one reel at a time.">
  <meta name="theme-color" content="#0E0C0A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="REELHOUSE">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>REELHOUSE — Every film, one reel at a time</title>
  <link rel="manifest" href="manifest.json">

  <!-- SPA Redirect support for GitHub Pages -->
  <script>
    (function(l) {
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0E0C0A;
      color: #F2E8D5;
      font-family: 'Courier New', monospace;
    }
    #loading-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: #0E0C0A;
      z-index: 99999;
      pointer-events: none !important;
      transition: opacity 0.35s ease-out;
    }
    .sprocket-box {
      width: 56px;
      height: 56px;
      border: 2px solid #FFB020;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 0 16px rgba(255, 176, 32, 0.35);
    }
    .amber-dot {
      width: 14px;
      height: 14px;
      background-color: #FFB020;
      border-radius: 50%;
      animation: pulse 1s infinite alternate ease-in-out;
    }
    .title {
      font-size: 26px;
      letter-spacing: 5px;
      font-weight: 900;
      color: #FFB020;
      margin: 0 0 8px 0;
      text-transform: uppercase;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 3px;
      color: #8A8070;
      text-transform: uppercase;
    }
    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="sprocket-box">
      <div class="amber-dot"></div>
    </div>
    <div class="title">REELHOUSE</div>
    <div class="subtitle">THREADING 35MM PROJECTOR...</div>
  </div>

  <script>
    function removeLoadingSplash() {
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoadingSplash);
    setTimeout(removeLoadingSplash, 1800);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
